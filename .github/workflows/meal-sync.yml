name: Meal Data Sync

on:
  schedule:
    # 매일 한국 시간 새벽 5시 (UTC 20:00) - 하루 식단을 아침 일찍 업데이트
    - cron: '0 20 * * *'
  push:
    branches: [ main, master ]
    paths:
      - 'backend/services/crawler/meal.py'
      - 'backend/app/run_meal_crawler.py'
  workflow_dispatch:

jobs:
  run-meal-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-crawler.txt
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('backend/requirements-crawler.txt') }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-crawler.txt
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium --with-deps
      - name: Install Playwright Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium
      - name: Execute Meal Crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cd backend
          python app/run_meal_crawler.py