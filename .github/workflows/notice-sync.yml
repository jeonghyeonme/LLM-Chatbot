name: Notice Data Sync

on:
  schedule:
    # 매일 한국 시간 오전 8시, 오후 1시, 오후 6시 (UTC 23:00, 04:00, 09:00) - 공지사항은 자주 업데이트 확인
    - cron: '0 23,4,9 * * *'
  push:
    branches: [ main, master ]
    paths:
      - 'backend/services/crawler/notice.py'
      - 'backend/app/run_notice_crawler.py'
  workflow_dispatch:

jobs:
  run-notice-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-crawler.txt
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('backend/requirements-crawler.txt') }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-crawler.txt
      - name: Install Playwright Browsers
        run: python -m playwright install chromium --with-deps
      - name: Execute Notice Crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cd backend
          python app/run_notice_crawler.py