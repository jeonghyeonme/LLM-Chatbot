name: Career Data Sync

on:
  schedule:
    # 매일 한국 시간 오후 5시 (UTC 08:00) - 취업 공고는 하루 일과가 끝날 무렵 업데이트
    - cron: '0 8 * * *'
  push:
    branches: [ main, master ]
    paths:
      - 'backend/services/crawler/career.py'
      - 'backend/app/run_career_crawler.py'
  workflow_dispatch:

jobs:
  run-career-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-crawler.txt
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('backend/requirements-crawler.txt') }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-crawler.txt
      - name: Install Playwright Browsers
        run: python -m playwright install chromium --with-deps
      - name: Execute Career Crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CAMPUS_ID: ${{ secrets.CAMPUS_ID }}
          CAMPUS_PW: ${{ secrets.CAMPUS_PW }}
          PYTHONUNBUFFERED: 1
        run: |
          cd backend
          python app/run_career_crawler.py